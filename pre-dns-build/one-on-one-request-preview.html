<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Request 1:1 Support | ITASA Learning Center</title>
  <style>
    :root{--teal:#177982;--teal-dark:#0d5961;--orange:#dd7b2d;--ink:#18343b;--muted:#63767b;--line:#d9e7e8;--soft:#f5fafa;--warm:#fff6ec;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:#f8fbfb}
    *{box-sizing:border-box}body{margin:0}a{color:var(--teal-dark)}
    header{background:#fff;border-bottom:1px solid var(--line)}nav{max-width:900px;margin:auto;padding:14px 18px;display:flex;align-items:center;gap:14px}
    .brand{font-weight:900;text-decoration:none;margin-right:auto}.brand img{width:48px;height:48px;vertical-align:middle;margin-right:8px;border-radius:50%}
    main{max-width:820px;margin:auto;padding:36px 18px 64px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 7px 20px rgba(17,71,78,.05)}
    .eyebrow{text-transform:uppercase;letter-spacing:.09em;font-size:.76rem;font-weight:900;color:var(--teal)}h1{margin:.35rem 0 .8rem;font-size:clamp(1.8rem,4vw,2.7rem)}
    .lead,.muted{color:var(--muted)}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.full{grid-column:1/-1}
    label{display:block;font-weight:800;margin-bottom:5px}input,textarea{width:100%;padding:11px 12px;border:1px solid #b9cbcd;border-radius:9px;font:inherit;background:#fff}
    textarea{min-height:100px;resize:vertical}.ack{display:flex;gap:10px;align-items:flex-start;font-weight:500}.ack input{width:auto;margin-top:4px}
    .btn{display:inline-block;border:0;border-radius:10px;padding:11px 15px;font:inherit;font-weight:800;cursor:pointer;text-decoration:none;background:var(--teal);color:#fff}
    .btn.secondary{background:#e8f4f4;color:var(--teal-dark)}.notice{border-radius:11px;padding:13px 15px;background:#eef7f7;margin-top:12px}.notice.error{background:#fff0f0;color:#8a3030}.notice.success{background:#ecf7f0;color:#2b6447}
    [hidden]{display:none!important}@media(max-width:640px){.form-grid{grid-template-columns:1fr}.full{grid-column:auto}}
  </style>
</head>
<body>
<header><nav><a class="brand" href="index.html"><img src="assets/itasa-circular-brand-logo.png" alt="ITASA logo">ITASA Learning Center</a><a id="back-link" href="student-portal-cutover-preview.html?stay=1">Back to Student Home</a></nav></header>
<main>
  <div class="card">
    <div class="eyebrow">Additional Learning Support</div>
    <h1>Request an ITASA Personalized Learning Session (1:1)</h1>
    <p class="lead">One-hour private session · $100. Tell ITASA what support you need and share your preferred date/time. ITASA confirms the appointment before payment.</p>
    <form id="one-on-one-form">
      <div class="form-grid">
        <div><label for="one-first">First Name</label><input id="one-first" name="first_name" required></div>
        <div><label for="one-last">Last Name</label><input id="one-last" name="last_name" required></div>
        <div class="full"><label for="one-email">Email</label><input id="one-email" name="email" type="email" required></div>
        <input type="hidden" name="session_length" value="1_hour">
        <div class="full"><label for="one-help">Assistance Needed</label><textarea id="one-help" name="assistance_needed" placeholder="Tell us what test-taking strategies you would like help with"></textarea></div>
        <div class="full"><label for="one-time-1">First Preferred Date/Time</label><input id="one-time-1" name="preferred_datetime_1" required></div>
        <div class="full"><label for="one-time-2">Second Preferred Date/Time (optional)</label><input id="one-time-2" name="preferred_datetime_2"></div>
        <div class="full"><label for="one-time-3">Third Preferred Date/Time (optional)</label><input id="one-time-3" name="preferred_datetime_3"></div>
        <div class="full"><label class="ack"><input type="checkbox" name="acknowledgement" required><span>I understand that submitting this request does not confirm an appointment. ITASA will confirm availability before payment.</span></label></div>
      </div>
      <button class="btn" type="submit" style="margin-top:15px">Submit 1:1 Session Request</button>
    </form>
    <div id="one-on-one-status" class="notice" hidden></div>
    <div id="one-on-one-result" class="notice success" hidden></div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/public-hub-vnext.js"></script>
<script>
(function(){
  var back=document.getElementById('back-link');
  var from=(new URLSearchParams(window.location.search).get('from')||'').toLowerCase();
  var ref=(document.referrer||'').toLowerCase();
  var source=from||ref;
  var routes=[
    {match:['iv','iv-learning-space-preview'],href:'iv-learning-space-preview.html',label:'Back to IV Space'},
    {match:['skills','skills-refresher','skills-learning-space-preview'],href:'skills-learning-space-preview.html',label:'Back to Skills Refresher Space'},
    {match:['medtech','medication','medtech-learning-space-preview'],href:'medtech-learning-space-preview.html',label:'Back to Medication Technician Space'},
    {match:['nclex','review','nclex-learning-space-preview'],href:'nclex-learning-space-preview.html',label:'Back to NCLEX Space'}
  ];
  for(var i=0;i<routes.length;i++){
    if(routes[i].match.some(function(v){return source.indexOf(v)>-1})){
      back.href=routes[i].href;back.textContent=routes[i].label;break;
    }
  }
  function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
  function show(el,html,tone){el.hidden=false;el.className='notice '+(tone||'');el.innerHTML=html}
  document.getElementById('one-on-one-form').addEventListener('submit',async function(ev){
    ev.preventDefault();
    var form=ev.currentTarget,btn=form.querySelector('button[type="submit"]'),status=document.getElementById('one-on-one-status'),result=document.getElementById('one-on-one-result');
    status.hidden=true;result.hidden=true;btn.disabled=true;btn.textContent='Submitting…';
    var fd=new FormData(form);
    var response=await window.ItasaPublicHubVNext.submitOneOnOne({
      first_name:fd.get('first_name'),last_name:fd.get('last_name'),email:fd.get('email'),
      session_length:'1_hour',assistance_needed:fd.get('assistance_needed'),
      preferred_datetime_1:fd.get('preferred_datetime_1'),preferred_datetime_2:fd.get('preferred_datetime_2'),
      preferred_datetime_3:fd.get('preferred_datetime_3'),acknowledgement:fd.get('acknowledgement')==='on'
    });
    btn.disabled=false;btn.textContent='Submit 1:1 Session Request';
    var errors={invalid_email:'Please enter a valid email address.',name_required:'First and last name are required.',preferred_time_required:'Please provide at least one preferred date/time.',acknowledgement_required:'Please accept the appointment acknowledgement before submitting.'};
    if(response.status!=='received'){show(status,esc(errors[response.status]||'We were unable to save your request just now. Please try again.'),'error');return}
    result.innerHTML='<h3>Request received</h3><p>Your 1:1 Session Request has been submitted. ITASA will review your preferred dates and contact you after availability is confirmed.</p><p><strong>Requested session:</strong> 1 hour — $100</p><p class="muted">No appointment has been confirmed and no payment has been collected by this request.</p>';
    result.hidden=false;form.reset();
  });
})();
</script>
</body>
</html>
